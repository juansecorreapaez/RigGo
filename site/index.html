const STORAGE='riggo_state_v1';
function saveLocal(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}

async function api(path,opts={}){if(!CFG.apiBaseUrl)return null;const url=(CFG.apiBaseUrl==='/'?'':CFG.apiBaseUrl.replace(/\/$/,''))+path;const headers={'Content-Type':'application/json','X-RigGO-Email':state.auth.email,...(opts.headers||{})};const r=await fetch(url,{...opts,headers});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||`HTTP ${r.status}`);return r.headers.get('content-type')?.includes('json')?r.json():r.text()}
async function hydrateRemote(){if(!CFG.apiBaseUrl||!state.auth.logged)return;try{const data=await api('/bootstrap');if(data?.users){state.users=data.users;if(Array.isArray(data.moves)&&data.moves.length)state.moves=data.moves;if(Array.isArray(data.history)&&data.history.length)state.history=data.history;remoteOnline=true;saveLocal();if((!data.moves||!data.moves.length)&&state.moves.length)await api('/sync',{method:'POST',body:JSON.stringify({users:state.users,moves:state.moves,history:state.history})});render()}}catch(e){remoteOnline=false}}
let syncTimer=null;
function save(){saveLocal();if(remoteOnline){clearTimeout(syncTimer);syncTimer=setTimeout(async()=>{try{await api('/sync',{method:'POST',body:JSON.stringify({users:state.users,moves:state.moves,history:state.history})})}catch(e){}},500)}}

function currentUser(){return state.users.find(u=>u.email.toLowerCase()===state.auth.email.toLowerCase())}
function hasPerm(p){const u=currentUser();return !!u?.active&&(u.permissions||[]).includes(p)}
function visibleModules(){const u=currentUser();if(!u)return[];return['plan','execute','overall'].filter(p=>u.permissions.includes(p))}
function currentMove(){return state.moves.find(m=>m.id===state.selectedMoveId)||null}
function movePeriods(move){if(!move?.exec.actualRelease)return[];move.exec.periods=generatePeriodsFromRelease(move.exec.actualRelease,move.exec.closures,new Date(),CFG.dailyCutoffHour??6);return move.exec.periods}
function selectedPeriod(move){const ps=movePeriods(move);if(!ps.length)return null;if(!move.exec.selectedPeriodId||!ps.some(p=>p.id===move.exec.selectedPeriodId)){const pending=ps.find(p=>p.status==='Pendiente');move.exec.selectedPeriodId=(pending||ps.at(-1)).id}return ps.find(p=>p.id===move.exec.selectedPeriodId)||ps.at(-1)}
function pendingPeriods(move){return movePeriods(move).filter(p=>p.status==='Pendiente')}
function ensureClosure(move,id){if(move.exec.closures[id]){move.exec.closures[id].siteSupervisorRole=move.exec.closures[id].siteSupervisorRole||'Rig Manager';return move.exec.closures[id]};const p=movePeriods(move).find(x=>x.id===id);const prev=movePeriods(move).filter(x=>x.index<(p?.index||0)).sort((a,b)=>b.index-a.index).map(x=>move.exec.closures[x.id]).find(Boolean);const c={id,createdAt:nowIso(),closedAt:null,sentAt:null,reported:{rd:prev?.reported?.rd||0,rm:prev?.reported?.rm||0,ru:prev?.reported?.ru||0},overrides:{rd:false,rm:false,ru:false},progressNotes:{rd:'',rm:'',ru:''},scope:{mini:{down:prev?.scope?.mini?.down||0,up:prev?.scope?.mini?.up||0},camp:{down:prev?.scope?.camp?.down||0,up:prev?.scope?.camp?.up||0}},milestones:deepClone(prev?.milestones||move.milestones),flatEvents:[],originOps:'',destinationOps:'',next24:'',generalComment:'',crewSame:true,vehiclesSame:true,lmcSame:true,hseSame:true,crew:deepClone(prev?.crew||move.crew),vehicles:deepClone(prev?.vehicles||move.vehicles),lmc:deepClone(prev?.lmc||move.lmc),hse:deepClone(prev?.hse||move.hse),photos:[],participants:deepClone(prev?.participants||[{name:'',company:move.meta.operator,role:'Company Man',signature:''},{name:'',company:'Nabors',role:'Supervisor del sitio',signature:''}]),siteSupervisor:prev?.siteSupervisor||'',siteSupervisorRole:prev?.siteSupervisorRole||'Rig Manager',signature:'',safetyTopic:prev?.safetyTopic||'OPS-064 Instrucciones de mudanza específicas para el Rig',safetyUnderstood:'SÍ',permitsDay:0,permitsAcc:prev?.permitsAcc||0,risksDay:0,risksAcc:prev?.risksAcc||0,ocDay:0,ocAcc:prev?.ocAcc||0};if(prev?.flatEvents?.some(e=>e.ongoing)){c.flatEvents=prev.flatEvents.filter(e=>e.ongoing).map(e=>({...e,id:uid(),start:p.start,end:p.end,inherited:true}))}move.exec.closures[id]=c;return c}
function currentClosure(move){const p=selectedPeriod(move);return p?ensureClosure(move,p.id):null}
function actionTimestamp(period){const now=new Date(),end=new Date(period.end),start=new Date(period.start);if(now>start&&now<end)return now.toISOString();return new Date(end.getTime()-5*60000).toISOString()}
function reportDayNumber(move,period){if(!move.exec.actualRelease||!period)return 0;return (new Date(period.end)-new Date(move.exec.actualRelease))/86400000}
function closeAndAdvance(move,period,closure){const fs=flatSummary(closure.flatEvents,period);if(!fs.valid)throw new Error('El Flat Time neto supera las horas del periodo.');closure.closedAt=nowIso();const ps=movePeriods(move),idx=ps.findIndex(x=>x.id===period.id),next=ps[idx+1]||ps.find(x=>!move.exec.closures[x.id]?.closedAt);if(next)move.exec.selectedPeriodId=next.id;move.audit.push({at:nowIso(),user:state.auth.email,action:'close_day',period:period.id});save()}
function validateClosure(c,p){const fs=flatSummary(c.flatEvents,p),missing=[];if(!fs.valid)missing.push('Flat Time');if(!c.signature)missing.push('Firma');if(!(c.originOps||c.destinationOps).trim())missing.push('Operación últimas 24 horas');if(!String(c.next24||'').trim())missing.push('Próximas 24 Hrs');if(!String(c.siteSupervisor||'').trim())missing.push('Supervisor del sitio');if(!String(c.siteSupervisorRole||'').trim())missing.push('Cargo del supervisor');return{ok:!missing.length,missing,fs}}
function plannedLoadTotal(move){return move.plan.loadGroups.reduce((s,x)=>s+(Number(x.quantity)||1),0)}
function planScopeTotals(move){const out={Rig:0,'Mini Camp':0,Camp:0,'Operador / Terceros':0};move.plan.loadGroups.forEach(g=>out[normalizeScope(g.scope)]+=Number(g.quantity)||1);return out}
function businessScopeTotals(move){const all=plannedLoadTotal(move),mini=move.scope.mini?Number(move.scope.miniLoads)||0:0,camp=move.scope.camp?Number(move.scope.campLoads)||0:0,third=Number(move.scope.thirdLoads)||0;return{Rig:Math.max(0,all-mini-camp-third),'Mini Camp':mini,Camp:camp,'Operador / Terceros':third,Total:all}}

function shell(content){const u=currentUser();return `<div class="app-shell"><header class="topbar"><div class="brand"><img src="${ASSETS.nabors||''}" alt="Nabors"><span class="brand-divider"></span><div><div class="brand-name">RigGO</div><div class="brand-sub">OPERACIÓN DE MOVILIZACIONES</div></div></div>${state.auth.logged?`<div class="top-actions"><span class="user-pill">${enc(state.auth.email)}</span>${state.screen!=='home'?'<button class="btn small ghost" data-global="home">Inicio</button>':''}${hasPerm('admin')?'<button class="btn small ghost desktop-only" data-global="admin">Administrar</button>':''}<button class="btn small ghost" data-global="logout">Salir</button></div>`:''}</header><main class="main">${content}</main></div>`}
function render(){if(!state.auth.logged){renderLogin();return}const u=currentUser();if(!u?.active){state.auth={email:'',logged:false};saveLocal();renderLogin();return}const routes={home:renderHome,planList:renderPlanList,plan:renderPlan,moveSelect:renderMoveSelect,execute:renderExecute,overall:renderOverall,admin:renderAdmin,review:renderReview,closeout:renderCloseout};app.innerHTML=shell((routes[state.screen]||renderHome)());wireGlobal();if(state.screen==='home')wireHome();if(state.screen==='planList')wirePlanList();if(state.screen==='plan')wirePlan();if(state.screen==='moveSelect')wireMoveSelect();if(state.screen==='execute')wireExecute();if(state.screen==='overall')wireOverall();if(state.screen==='admin')wireAdmin();if(state.screen==='review')wireReview();if(state.screen==='closeout')wireCloseout();}
function wireGlobal(){document.querySelectorAll('[data-global="home"]').forEach(b=>b.onclick=goHome);document.querySelectorAll('[data-global="admin"]').forEach(b=>b.onclick=()=>{state.screen='admin';save();render()});document.querySelectorAll('[data-global="logout"]').forEach(b=>b.onclick=()=>{state.auth={email:'',logged:false};saveLocal();render()})}
function routeForUser(u){const mods=(u?.permissions||[]).filter(x=>['plan','execute','overall'].includes(x));return mods.length===1?(mods[0]==='plan'?'planList':mods[0]==='execute'?'moveSelect':'overall'):'home'}
function goHome(){state.screen=routeForUser(currentUser());save();render()}
async function tryRemoteSession(){if(!CFG.apiBaseUrl||!CFG.autoSession||state.auth.logged)return;try{const base=CFG.apiBaseUrl==='/'?'':CFG.apiBaseUrl.replace(/\/$/,'');const r=await fetch(base+'/session',{credentials:'same-origin'});if(!r.ok)return;const data=await r.json(),u=data.user;if(!u?.active)return;const i=state.users.findIndex(x=>x.email.toLowerCase()===u.email.toLowerCase());if(i>=0)state.users[i]=u;else state.users.push(u);state.auth={email:u.email.toLowerCase(),logged:true};state.screen=routeForUser(u);saveLocal();render();hydrateRemote()}catch(e){}}

function renderLogin(){app.innerHTML=shell(`<div class="login-wrap"><div class="login-card"><div class="login-mark">GO</div><h1>RigGO</h1><p>Acceso Nabors</p><label>Correo corporativo<input id="loginEmail" class="field" type="email" value="demo@nabors.com" placeholder="nombre@nabors.com"></label><button id="loginBtn" class="btn primary big" style="width:100%;margin-top:12px">Ingresar</button><div id="loginError" class="small" style="color:#ffafb8;margin-top:8px"></div></div></div>`);$('loginBtn').onclick=login;$('loginEmail').onkeydown=e=>{if(e.key==='Enter')login()}}
async function login(){const email=$('loginEmail').value.trim().toLowerCase(),domain=(CFG.allowedDomain||'nabors.com').toLowerCase();if(!email.endsWith('@'+domain)){$('loginError').textContent='Correo no válido.';return}let u=state.users.find(x=>x.email.toLowerCase()===email);if(CFG.apiBaseUrl){try{const r=await fetch((CFG.apiBaseUrl==='/'?'':CFG.apiBaseUrl.replace(/\/$/,''))+'/session',{headers:{'X-RigGO-Email':email}});if(r.ok){const data=await r.json();u=data.user;if(u&&!state.users.some(x=>x.email===u.email))state.users.push(u)}}catch(e){}}if(!u?.active){$('loginError').textContent='Usuario no autorizado.';return}state.auth={email,logged:true};saveLocal();state.screen=routeForUser(u);render();hydrateRemote()}

Guardar nueva contraseña'}}}}

  window.RigGOEmailTest = async function(){
    const toEl=$('testEmailTo'),btn=$('sendEmailTest'),result=$('emailTestResult');
    const to=(toEl?.value||'').trim();

    if(btn){btn.disabled=true;btn.textContent='Enviando…'}
    if(result){result.style.color='#a8c0ff';result.textContent='Conectando RigGO → Supabase → Resend…'}
    try{
      const stamp=new Intl.DateTimeFormat('es-CO',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Bogota'}).format(new Date());
      const {data,error}=await SB.functions.invoke('riggo-send-email',{

        }

  tryRemoteSession = async function(){
    const prior=deepClone(state.auth||{email:'',logged:false});
    if(initialRecoveryError){state.auth={email:'',logged:false};renderLogin();const expired=/otp_expired|expired|invalid/i.test(String(initialRecoveryError.code)+' '+String(initialRecoveryError.desc));passwordResetMessage(expired?'El enlace de recuperación expiró o ya fue utilizado. Solicita uno nuevo.':(initialRecoveryError.desc||'No fue posible validar el enlace de recuperación.'));try{history.replaceState(null,'',window.location.pathname)}catch(_){};return}

  // RigGO 11.3: do not hydrate or clear state here. Final Sync Core restores

  window.__RIGGO_BOOT_DEFERRED__=true;
  renderLogin();
})();

<script id="riggo-step6">

<style id="riggo-email-v5-style">

</head><body>${inner}</body></html>`;

  async function waitImages(root){
    const imgs=[...root.querySelectorAll('img')];
    await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve})));
  }

  function loadExternalScript(url,test,timeoutMs=15000){
    if(test())return Promise.resolve(true);
    return new Promise((resolve,reject)=>{
      const existing=[...document.scripts].find(s=>s.src===url);
      let settled=false;
      const done=(ok,err)=>{if(settled)return;settled=true;clearTimeout(timer);ok?resolve(true):reject(err||new Error('No cargó '+url))};
      const timer=setTimeout(()=>done(false,new Error('Timeout cargando '+url)),timeoutMs);
      const s=existing||document.createElement('script');
      if(!existing){s.src=url;s.async=true;s.referrerPolicy='no-referrer';document.head.appendChild(s)}
      s.addEventListener('load',()=>test()?done(true):done(false,new Error('La librería cargó pero no quedó disponible.')),{once:true});
      s.addEventListener('error',()=>done(false,new Error('No fue posible descargar '+url)),{once:true});
      if(existing&&test())done(true);
    });
  }

  async function ensurePdfEngine(){
    if(!window.html2canvas){
      const urls=[
        './assets/vendor/html2canvas-1.4.1.min.js'
      ];
      let lastErr;
      for(const url of urls){try{await loadExternalScript(url,()=>typeof window.html2canvas==='function');lastErr=null;break}catch(e){lastErr=e}}
      if(lastErr||!window.html2canvas)throw new Error('No fue posible cargar html2canvas. Recarga la aplicación para recuperar los archivos de esta versión.');
    }
    if(!window.jspdf?.jsPDF){
      const urls=[
        './assets/vendor/jspdf-2.5.1.min.js'
      ];
      let lastErr;
      for(const url of urls){try{await loadExternalScript(url,()=>!!window.jspdf?.jsPDF);lastErr=null;break}catch(e){lastErr=e}}
      if(lastErr||!window.jspdf?.jsPDF)throw new Error('No fue posible cargar jsPDF. Recarga la aplicación para recuperar los archivos de esta versión.');
    }
    return true;
  }

  async function generateOpsPdfBlob(m,p,c){
    await ensurePdfEngine();
    const host=document.createElement('div');host.id='riggoPdfHost';host.innerHTML=f0065Html(m,p,c);document.body.appendChild(host);
    try{
      await waitImages(host);
      const pages=[...host.querySelectorAll('.f0065-page')];
      if(!pages.length)throw new Error('No se encontraron páginas del OPS.');
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
      for(let i=0;i<pages.length;i++){
        if(i>0)pdf.addPage('a4','portrait');
        const canvas=await window.html2canvas(pages[i],{scale:1.35,useCORS:true,backgroundColor:'#ffffff',logging:false,width:pages[i].scrollWidth,height:pages[i].scrollHeight,windowWidth:1200});
        const img=canvas.toDataURL('image/jpeg',0.91);
        pdf.addImage(img,'JPEG',0,0,210,297,undefined,'FAST');
      }
      return pdf.output('blob');
    }finally{host.remove()}
  }

    if(!c.f0065ReviewedAt){state.reportView='f0065';save();render();toast('Revisa el OPS antes del email');return}

      photoSnapshot.forEach((x,i)=>attachments.push({filename:`RigGO_Photo_${i+1}.jpg`,content:base64FromDataUrl(x),contentId:`photo-${i+1}`}));
      const response=await invokeEmail({to,cc,subject:emailSubject(m,p),html:finalEmailHtml(m,p,{...c,photos:photoSnapshot,signature:signatureSnapshot}),replyTo:state.auth.email||undefined,attachments});
      const sentAt=nowIso();c.sentAt=sentAt;c.sendStatus='sent';c.messageId=response.messageId||'';c.reportPhotoCount=photoSnapshot.length;c.reportHadSignature=!!signatureSnapshot;
      await SB.from('reports').update({status:'sent',provider_message_id:response.messageId||null,sent_at:sentAt}).eq('id',dReportId);
      await SB.from('reports').update({status:'sent',provider_message_id:response.messageId||null,sent_at:sentAt}).eq('id',fReportId);

    }finally{reportBusy=false;if(btn&&document.body.contains(btn)){btn.disabled=false;btn.textContent=c.sentAt?'Reenviar':'Enviar Daily Move Update + OPS'}}
  };

  window.RigGOReportV12={generateOpsPdfBlob,ensureDbPeriod,saveClosureRecord,openStoredOps};window.finalEmailHtml=finalEmailHtml;
})();

/* Variable cutoff engine */
function partsLocal(iso){const d=new Date(iso),l=new Date(d.getTime()+OFFSET*60000);return{y:l.getUTCFullYear(),m:l.getUTCMonth()+1,d:l.getUTCDate(),hh:l.getUTCHours(),mm:l.getUTCMinutes()}}

function canOfferMoveClose(m){const ps=movePeriods(m);if(!ps.length)return false;if(ps.every(p=>!!m.exec.closures?.[p.id]?.closedAt))return true;const last=ps.at(-1);return ps.slice(0,-1).every(p=>!!m.exec.closures?.[p.id]?.closedAt)&&!m.exec.closures?.[last.id]?.closedAt&&!periodHasWork(m,last)}

movePeriods=function(m){if(!m?.exec.actualRelease)return[];ensureMoveV3(m);const now=new Date(),out=[];let start=m.exec.actualRelease,idx=1;const forced=Math.max(0,Number(m.exec.forcedThroughDay)||0),planned=plannedDayCount(m),acceptance=m.exec.actualAcceptance?new Date(m.exec.actualAcceptance):null;while(idx<=150){const id=`D${idx}`,cut=cutoffFor(m,id),manualEnd=String(m.exec.cutoffEnds?.[id]||'');let end=endForDay(start,idx,cut),startDate=new Date(start),endDate=new Date(end),finalByAcceptance=false,manualCutoff=false;if(manualEnd){const md=new Date(manualEnd);if(!Number.isNaN(md.getTime())&&md>startDate){end=md.toISOString();endDate=md;manualCutoff=true}}if(acceptance){if(startDate>=acceptance)break;if(endDate>acceptance){end=acceptance.toISOString();endDate=acceptance;finalByAcceptance=true}}const closed=!!m.exec.closures?.[id]?.closedAt,status=closed?'Cerrado':startDate>now?'Programado':endDate<=now?'Pendiente':'En curso';out.push({id,index:idx,start,end,cutoffTime:cut,expectedHours:(endDate-startDate)/3600000,status,extension:idx>planned,finalPeriod:finalByAcceptance,manualCutoff});if(finalByAcceptance)break;if(endDate>now&&idx>1&&idx>=forced)break;start=end;idx++}m.exec.periods=out;return out};

function taskStats(m,phase,p){const list=phase==='rd'?m.exec.tasksRD:m.exec.tasksRU,planned=list.filter(x=>(+x.day||1)===p.index&&!x.isUnplanned),pending=planned.filter(x=>!doneBy(x,p)),advanced=list.filter(x=>(+x.day||1)>p.index&&doneIn(x,p)),unplanned=list.filter(x=>x.isUnplanned&&doneIn(x,p));return{list,planned,pending,advanced,unplanned,done:planned.length-pending.length}}

function progressScreen(m,p,c){const plan=currentPlanPcts(m,p),s=suggestedPcts(m,p),r=scopeCounts(m,'Rig',p),mi=scopeCounts(m,'Mini Camp',p),ca=scopeCounts(m,'Camp',p);const milestones=(c.milestones||[]).map((x,i)=>`<article class="v56-ms-card"><div class="v56-ms-head"><span class="v56-ms-kicker">Hito</span><h3>${enc(x.name)}</h3></div><div class="v56-ms-row locked"><span>Plan Base</span><strong>${x.base?fmtDate(x.base,true):'—'}</strong><i aria-hidden="true">🔒</i></div><label class="v56-ms-row editable"><span>Proyección</span><input class="field" data-forecast="${i}" type="datetime-local" value="${toInput(x.forecast)}"></label><label class="v56-ms-row editable"><span>Actual</span><input class="field" data-msactual="${i}" type="datetime-local" value="${toInput(x.actual)}"></label></article>`).join('');return `<div class="grid g3 v56-progress-cards">${progressCardV3('Rig Down','rd',plan.rd,s.rd,c,`${m.exec.tasksRD.filter(x=>doneBy(x,p)).length} / ${m.exec.tasksRD.length} actividades`)}${progressCardV3('Rig Move','rm',plan.rm,s.rm,c,`${m.exec.loads.filter(x=>statusAt(x,p.end)==='Posicionada').length} / ${m.exec.loads.length} posicionadas`)}${progressCardV3('Rig Up','ru',plan.ru,s.ru,c,`${m.exec.tasksRU.filter(x=>doneBy(x,p)).length} / ${m.exec.tasksRU.length} actividades`)}</div><div class="grid g3 v56-scope-bands">${scopeBand(m,'RIG','rig',r,true,c,p)}${m.scope.mini?scopeBand(m,'MINI CAMP','mini',mi,false,c,p):''}${m.scope.camp?scopeBand(m,'CAMPAMENTO','camp',ca,false,c,p):''}</div><div class="chart-grid v56-charts">${chartCard('chartRD','Rig Down Planned vs Actual')}${chartCard('chartRM','Rig Move Planned vs Actual')}${chartCard('chartRU','Rig Up Planned vs Actual')}</div><section class="panel v56-milestones"><div class="v56-section-head"><div><h2>Hitos</h2><div class="small muted">Plan Base, proyección vigente y fecha real.</div></div></div><div class="v56-ms-grid">${milestones||'<div class="small muted">Sin hitos configurados.</div>'}</div></section>`}

function showTaskAdd(m,p,phase){sheetRoot.innerHTML=`<div class="sheet-backdrop"><div class="sheet"><div class="sheet-handle"></div><h2>Actividad no planificada</h2><div class="sheet-sub">${phase==='rd'?'Rig Down':'Rig Up'} · Día ${p.index}</div><label>Descripción<textarea id="v3TaskText" class="field" rows="3"></textarea></label><label style="margin-top:8px">Comentario<input id="v3TaskComment" class="field"></label><div class="sheet-footer"><button id="cancelSheet" class="btn">Cancelar</button><button id="v3SaveTask" class="btn primary">Agregar</button></div></div></div>`;$('cancelSheet').onclick=closeSheet;$('v3SaveTask').onclick=()=>{const text=$('v3TaskText').value.trim();if(!text)return;const list=phase==='rd'?m.exec.tasksRD:m.exec.tasksRU;list.push({id:safeId(),day:p.index,seq:list.length+1,text,comment:$('v3TaskComment').value.trim(),isUnplanned:true,addedDuringDay:p.index,doneAt:actionTimestamp(p),doneBy:state.auth.email});m.audit.push({at:nowIso(),user:state.auth.email,action:'add_unplanned_task',phase,period:p.id,text});save();closeSheet();render();scrollTopNow()}}
function showLoadAdd(m,p){const scopes=loadScopes(m);sheetRoot.innerHTML=`<div class="sheet-backdrop"><div class="sheet"><div class="sheet-handle"></div><h2>Carga no planificada</h2><div class="sheet-sub">Alcance adicional · Día ${p.index}</div><label>Descripción<input id="v3LoadText" class="field"></label><div class="grid g2" style="margin-top:8px"><label>Alcance<select id="v3LoadScope" class="field">${scopes.map(s=>`<option>${s}</option>`).join('')}</select></label><label>Cantidad<input id="v3LoadQty" class="field" type="number" min="1" value="1"></label><label>Vehículo<input id="v3LoadVehicle" class="field" placeholder="Lowboy / Flatbed..."></label></div><div class="sheet-footer"><button id="cancelSheet" class="btn">Cancelar</button><button id="v3SaveLoad" class="btn primary">Agregar</button></div></div></div>`;$('cancelSheet').onclick=closeSheet;$('v3SaveLoad').onclick=()=>{const text=$('v3LoadText').value.trim(),qty=Math.max(1,+$('v3LoadQty').value||1);if(!text)return;for(let i=1;i<=qty;i++)m.exec.loads.push({id:safeId(),plannedDay:p.index,scope:$('v3LoadScope').value,description:text+(qty>1?` · ${i}/${qty}`:''),vehicle:$('v3LoadVehicle').value.trim(),history:[],isUnplanned:true,addedDuringDay:p.index});m.audit.push({at:nowIso(),user:state.auth.email,action:'add_unplanned_load',period:p.id,description:text,quantity:qty});save();closeSheet();render();scrollTopNow()}}
function showProgressEdit(m,p,c,key){const s=suggestedPcts(m,p),rep=reportValue(c,key,s[key]),lab={rd:'Rig Down',rm:'Rig Move',ru:'Rig Up'};sheetRoot.innerHTML=`<div class="sheet-backdrop"><div class="sheet"><div class="sheet-handle"></div><h2>${lab[key]}</h2><div class="sheet-sub">Reporte sugerido ${Math.round(s[key])}%</div><label>Porcentaje a reportar<input id="v3ProgressNumber" class="field v3-number-input" type="number" inputmode="decimal" min="0" max="100" value="${rep}"></label><div class="sheet-footer"><button id="cancelSheet" class="btn">Cancelar</button><button id="v3UseSuggested" class="btn">Usar ${Math.round(s[key])}%</button><button id="v3ApplyProgress" class="btn primary">Aplicar</button></div></div></div>`;$('cancelSheet').onclick=closeSheet;$('v3UseSuggested').onclick=()=>{c.overrides[key]=false;c.reported[key]=Math.round(s[key]);save();closeSheet();render();scrollTopNow()};$('v3ApplyProgress').onclick=()=>{c.overrides[key]=true;c.reported[key]=clamp($('v3ProgressNumber').value);m.audit.push({at:nowIso(),user:state.auth.email,action:'progress_override',period:p.id,key,value:c.reported[key]});save();closeSheet();render();scrollTopNow()};setTimeout(()=>{$('v3ProgressNumber')?.focus();$('v3ProgressNumber')?.select()},70)}

function transitionData(m,p,kind){if(kind==='rd'||kind==='ru'){const s=taskStats(m,kind,p);return{title:kind==='rd'?'Rig Down':'Rig Up',done:s.done,total:s.planned.length,pending:s.pending.map(x=>x.text),advanced:s.advanced.map(x=>x.text)}}const s=loadStats(m,p,null);return{title:'Transporte de Cargas',done:s.moved,total:s.planned.length,pending:s.pending.map(x=>x.description),advanced:s.advanced.map(x=>x.description)}}
function showTransition(m,p,kind,next){const s=transitionData(m,p,kind);sheetRoot.innerHTML=`<div class="sheet-backdrop"><div class="sheet"><div class="sheet-handle"></div><h2>${s.title} · Día ${p.index}</h2><div class="v3-summary-grid"><div><span>Completadas</span><b>${s.done}/${s.total}</b></div><div><span>Pendientes</span><b>${s.pending.length}</b></div><div><span>Adelantadas</span><b>${s.advanced.length}</b></div></div>${!s.pending.length&&!s.advanced.length?'<div class="status good" style="margin-top:10px;justify-content:center;padding:9px">Plan del Día completado · Sin pendientes</div>':''}${s.pending.length?`<div style="margin-top:10px"><b class="small">Pendiente</b><div class="v3-summary-list">${s.pending.map(x=>`<div class="pending">• ${enc(x)}</div>`).join('')}</div></div>`:''}${s.advanced.length?`<div style="margin-top:10px"><b class="small">Adelantadas</b><div class="v3-summary-list">${s.advanced.map(x=>`<div class="advance">• ${enc(x)}</div>`).join('')}</div></div>`:''}<div class="sheet-footer"><button id="cancelSheet" class="btn">Revisar</button><button id="v3Continue" class="btn primary">Continuar →</button></div></div></div>`;$('cancelSheet').onclick=closeSheet;$('v3Continue').onclick=()=>{closeSheet();state.execTab=next;state.searchMove='';save();render();scrollTopNow()}}

/* Flat Time final forms */
flatForm=function(type,m,p,c,existing=null){const t=FLAT_TYPES.find(x=>x.id===type),e=existing||{id:safeId(),type,start:p.start,end:p.end,ongoing:false,subtype:'',affected:'',company:type==='move_company'?m.meta.moveCompany:'',responsibility:type==='weather'?'No aplica':type==='move_company'?'Empresa de Move':'No aplica',commercial:type==='weather'?'No aplica':'Por definir',issue:'',resource:'',capacity:'',failureMode:'',description:''};const interval=`<div class="grid g2"><label>Desde<input id="flatStart" class="field" type="datetime-local" value="${toInput(e.start||p.start)}"></label><label>Hasta<input id="flatEnd" class="field" type="datetime-local" value="${toInput(e.end||p.end)}"></label></div><label class="checkbox" style="margin-top:8px"><input id="flatOngoing" type="checkbox" ${e.ongoing?'checked':''}> Continúa activo al corte</label>`;let extra='';if(type==='community')extra=`<div class="grid g2"><label>Tipo<select id="flatSubtype" class="field"><option>Bloqueo de cuadrilla</option><option>Bloqueo de comunidad</option><option>Bloqueo de proveedores</option><option>Otro</option></select></label><label>A quién afecta<select id="flatAffected" class="field"><option>Nabors</option><option>Empresa de Move</option><option>Operador</option><option>Tercero</option></select></label></div>`;if(type==='weather')extra=`<div class="grid g2"><label>Tipo<select id="flatSubtype" class="field"><option ${e.subtype==='Tormenta eléctrica'?'selected':''}>Tormenta eléctrica</option><option ${e.subtype==='Lluvia'?'selected':''}>Lluvia</option><option ${e.subtype==='Inundación'?'selected':''}>Inundación</option><option ${e.subtype==='Otro'?'selected':''}>Otro</option></select></label><label>Nivel / condición<input id="flatIssue" class="field" value="${enc(e.issue)}"></label></div>`;if(type==='move_company')extra=`<div class="grid g2"><label>Empresa<input id="flatCompany" class="field" value="${enc(e.company||m.meta.moveCompany)}"></label><label>Problema<select id="flatIssue" class="field"><option>Camión no llegó</option><option>Camión averiado</option><option>Grúa averiada</option><option>Grúa no disponible</option><option>Flota insuficiente</option><option>Personal</option><option>Bloqueo afectando compañía</option><option>Otro</option></select></label><label>Recurso<input id="flatResource" class="field" value="${enc(e.resource)}"></label><label>Capacidad<input id="flatCapacity" class="field" value="${enc(e.capacity)}"></label><label>Modo de falla<input id="flatFailure" class="field" value="${enc(e.failureMode)}"></label></div>`;if(type==='mobility')extra=`<div class="grid g2"><label>Restricción<input id="flatSubtype" class="field" value="${enc(e.subtype)}"></label><label>Fuente<input id="flatIssue" class="field" value="${enc(e.issue)}"></label></div>`;if(type==='road')extra=`<label>Condición de vía / locación<input id="flatSubtype" class="field" value="${enc(e.subtype)}"></label>`;if(type==='preventive')extra=`<div class="grid g2"><label>Equipo / sistema<input id="flatResource" class="field" value="${enc(e.resource)}"></label><label>Actividad<input id="flatSubtype" class="field" value="${enc(e.subtype)}"></label></div>`;if(type==='rig_repair')extra=`<div class="grid g2"><label>Tipo<select id="flatSubtype" class="field"><option ${e.subtype==='Rig Repair'?'selected':''}>Rig Repair</option><option ${e.subtype==='Commissioning'?'selected':''}>Commissioning</option><option ${e.subtype==='Functional Test'?'selected':''}>Functional Test</option><option ${e.subtype==='Acceptance'?'selected':''}>Acceptance</option><option ${e.subtype==='Otro'?'selected':''}>Otro</option></select></label><label>Equipo / sistema<input id="flatResource" class="field" value="${enc(e.resource)}"></label></div>`;if(type==='operator')extra=`<div class="grid g2"><label>Compañía / parte<input id="flatCompany" class="field" value="${enc(e.company)}"></label><label>Situación<input id="flatSubtype" class="field" value="${enc(e.subtype)}"></label></div>`;if(type==='hse'||type==='other')extra=`<label>${type==='hse'?'Restricción':'Tipo'}<input id="flatSubtype" class="field" value="${enc(e.subtype)}"></label>`;return `<div class="sheet-backdrop"><div class="sheet"><div class="sheet-handle"></div><h2>${t.label}</h2><div class="sheet-sub">Día ${p.index} · ${p.cutoffTime} corte</div>${interval}<div style="margin-top:9px">${extra}</div><div class="grid g2" style="margin-top:9px"><label>Responsabilidad<select id="flatResponsibility" class="field">${FINAL_RESP.map(v=>`<option ${e.responsibility===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Tratamiento<select id="flatCommercial" class="field">${FINAL_COMMERCIAL.map(v=>`<option ${e.commercial===v?'selected':''}>${v}</option>`).join('')}</select></label></div><label style="margin-top:9px">Detalle<textarea id="flatDescription" class="field" rows="4">${enc(e.description)}</textarea></label><div class="sheet-footer"><button id="cancelSheet" class="btn">Cancelar</button><button id="saveFlat" class="btn primary">Guardar</button></div></div></div>`};
openFlatSheet=function(type,m,p,c){sheetRoot.innerHTML=flatForm(type,m,p,c);enhanceTimeInputs();$('cancelSheet').onclick=closeSheet;$('saveFlat').onclick=()=>{const e={id:safeId(),type,start:inputToIso($('flatStart').value),end:inputToIso($('flatEnd').value),ongoing:$('flatOngoing').checked,subtype:$('flatSubtype')?.value||'',affected:$('flatAffected')?.value||'',company:$('flatCompany')?.value||'',responsibility:$('flatResponsibility').value,commercial:$('flatCommercial').value,issue:$('flatIssue')?.value||'',resource:$('flatResource')?.value||'',capacity:$('flatCapacity')?.value||'',failureMode:$('flatFailure')?.value||'',description:$('flatDescription').value.trim()};if(!e.start||!e.end){alert('Completa Desde y Hasta.');return}if(['community','move_company','rig_repair','operator','hse','other','mobility','road'].includes(type)&&!e.description){alert('Completa el detalle.');return}c.flatEvents.push(e);m.audit.push({at:nowIso(),user:state.auth.email,action:'flat_time_add',period:p.id,type});save();closeSheet();render();scrollTopNow()}}

function resourceBlock(title,key,c,html){
 const same=!!c[key],group={crewSame:'crew',vehiclesSame:'vehicles',lmcSame:'lmc'}[key],rows=group?(c[group]||[]):[];
 const total=rows.reduce((sum,x)=>sum+Math.max(0,Number(x.qty)||0),0);
 const summary=group?rows.length+' registros · '+total+(group==='crew'?' personas':' unidades'):Object.values(c.hse||{}).filter(v=>String(v||'').trim()).length+' apartados con información';
 if(same)html=html.replace(/<(input|select|textarea)\b/g,'<$1 disabled aria-disabled="true"');
 return '<div class="v3-resource"><div class="v3-resource-head"><b>'+title+'</b><label class="checkbox"><input type="checkbox" data-v3-carry="'+key+'" '+(same?'checked':'')+'> Sin cambios</label></div><div class="v3-resource-body '+(same?'readonly':'')+'"><details class="riggo-resource-review" data-riggo-disclosure="'+key+'" '+(!same?'open':'')+'><summary>'+summary+' · '+(same?'Revisar':'Editar')+'</summary>'+(same?'<p class="riggo-resource-note">Se conservan los recursos vigentes. Revisa el detalle o habilita la edición si cambió.</p><button type="button" class="btn" data-riggo-edit-resource="'+key+'">Editar '+title+'</button>':'')+'<div class="riggo-resource-fields">'+html+'</div></details></div></div>';
}
function compactLmcV3(list){return `<div class="editor-head v3-lmc-row"><span>Tipo</span><span>Cant.</span><span>Capacidad</span><span>Uso</span><span>Propiedad</span><span>Compañía</span><span>Operativo</span></div>`+list.map((x,i)=>`<div class="editor-row v3-lmc-row"><input class="field" data-daily="lmc" data-i="${i}" data-k="type" value="${enc(x.type)}"><input class="field" data-daily="lmc" data-i="${i}" data-k="qty" type="number" value="${x.qty}"><input class="field" data-daily="lmc" data-i="${i}" data-k="capacity" value="${enc(x.capacity)}"><input class="field" data-daily="lmc" data-i="${i}" data-k="use" value="${enc(x.use)}"><select class="field" data-daily="lmc" data-i="${i}" data-k="owner"><option ${x.owner==='Nabors'?'selected':''}>Nabors</option><option ${x.owner==='Empresa de Move'?'selected':''}>Empresa de Move</option><option ${x.owner==='Tercero'?'selected':''}>Tercero</option></select><input class="field" data-daily="lmc" data-i="${i}" data-k="company" value="${enc(x.company)}"><select class="field" data-daily="lmc" data-i="${i}" data-k="operational"><option ${x.operational==='Sí'?'selected':''}>Sí</option><option ${x.operational==='No'?'selected':''}>No</option></select></div>`).join('')}
function resourcesStep(c){return `<div class="panel">${resourceBlock('Personal','crewSame',c,compactCrew(c.crew))}${resourceBlock('Vehículos / Transporte','vehiclesSame',c,compactVehicles(c.vehicles))}${resourceBlock('Equipos LMC','lmcSame',c,compactLmcV3(c.lmc))}${resourceBlock('HSE / Emergencias','hseSame',c,`<label>Plan de Emergencias<textarea id="dailyEmergency" class="field" rows="3">${enc(c.hse.emergency)}</textarea></label><label style="margin-top:6px">Médico / Primeros Auxilios<textarea id="dailyMedic" class="field" rows="2">${enc(c.hse.medic)}</textarea></label><label style="margin-top:6px">Equipamiento de Seguridad<textarea id="dailySafety" class="field" rows="3">${enc(c.hse.safety)}</textarea></label>`)}</div>`}
window.RigGOResourcesHTML=resourcesStep;
function operationStep(m,p,c){const s=buildNarrativeSuggestions(m,p);return `<div class="panel"><div class="row between wrap"><div><h2>Operación del período</h2><div class="small muted">${fmtDate(p.start,true)} → ${fmtDate(p.end,true)}</div></div><button id="v3SuggestOps" class="btn small">Generar borrador</button></div><div class="ops-grid" style="margin-top:9px"><label>${enc(m.meta.origin)} · Origen<textarea id="originOps" class="field" rows="7">${enc(c.originOps||s.origin)}</textarea></label><label>${enc(m.meta.destination)} · Destino<textarea id="destinationOps" class="field" rows="7">${enc(c.destinationOps||s.destination)}</textarea></label></div><label style="margin-top:9px">Próximas 24 Hrs<textarea id="next24" class="field" rows="5">${enc(c.next24||next24Suggestion(m,p))}</textarea></label></div>`}
function safetyStep(c){return `<div class="panel"><h2>Seguridad</h2><div class="grid g2"><label>Tema reunión de seguridad<input id="safetyTopic" class="field" value="${enc(c.safetyTopic)}"></label><label>Asistencia y comprensión<select id="safetyUnderstood" class="field"><option ${c.safetyUnderstood==='SÍ'?'selected':''}>SÍ</option><option ${c.safetyUnderstood==='NO'?'selected':''}>NO</option></select></label></div><div class="grid g3" style="margin-top:8px"><label>Permisos · Día<input id="permitsDay" class="field" type="number" value="${c.permitsDay}"></label><label>Permisos · Acumulado<input id="permitsAcc" class="field" type="number" value="${c.permitsAcc}"></label><label>Análisis de Riesgos · Día<input id="risksDay" class="field" type="number" value="${c.risksDay}"></label><label>Análisis · Acumulado<input id="risksAcc" class="field" type="number" value="${c.risksAcc}"></label><label>Tarjetas SOC · Día<input id="ocDay" class="field" type="number" value="${c.ocDay}"></label><label>Tarjetas SOC · Acumulado<input id="ocAcc" class="field" type="number" value="${c.ocAcc}"></label></div></div>`}
function evidenceStep(c){ensureClosureV3(c);return `<div class="grid g2"><div class="panel"><h2>Evidencias</h2><div class="v3-photo-actions"><label class="btn small blue">Tomar foto<input id="v3Camera" type="file" accept="image/*" capture="environment" hidden></label><label class="btn small">Subir foto<input id="v3Upload" type="file" accept="image/*" multiple hidden></label></div><div class="photo-grid" style="margin-top:9px">${c.photos.map((src,i)=>`<div class="photo v3-photo-card"><img src="${src}" alt="Evidencia ${i+1} de la operación"><button data-v3-delphoto="${i}" aria-label="Quitar foto ${i+1}">×</button><input class="field v3-photo-caption" data-v3-photocap="${i}" placeholder="Descripción opcional" value="${enc(c.photoCaptions[i]||'')}"></div>`).join('')||'<div class="photo riggo124-photo-empty">Añade fotos de la operación. Se conservarán al editar el reporte.</div>'}</div></div><div class="panel"><h2>Firma</h2><label>Supervisor del sitio<input id="siteSupervisor" class="field" value="${enc(c.siteSupervisor)}"></label><label style="margin-top:8px">Cargo<input id="siteSupervisorRole" class="field" value="${enc(c.siteSupervisorRole||'Rig Manager')}"></label><div class="signature" style="margin-top:8px"><canvas id="signatureCanvas" width="900" height="340"></canvas></div><button id="clearSignature" class="btn small" style="margin-top:6px">Quitar firma</button><label class="btn small riggo124-sign-upload">Subir imagen<input id="riggo124SignatureFile" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><p id="riggo124MediaStatus" role="status" aria-live="polite" class="riggo124-media-status">PNG, JPG o WebP · Hasta 5 MB</p><div class="sep"></div><div class="row between"><h2>Participantes</h2><button id="addParticipant" class="btn small">+ Participante</button></div>${c.participants.map((x,i)=>`<div class="grid" style="grid-template-columns:1.2fr 1fr 1.2fr;gap:5px;margin-top:5px"><input class="field" data-part="${i}" data-k="name" value="${enc(x.name)}"><input class="field" data-part="${i}" data-k="company" value="${enc(x.company)}"><input class="field" data-part="${i}" data-k="role" value="${enc(x.role)}"></div>`).join('')}</div></div>`}

function reportBody(m,p,c,step){if(step===0)return closeFlat(m,p,c);if(step===1)return resourcesStep(c);if(step===2)return operationStep(m,p,c);if(step===3)return safetyStep(c);if(step===4)return evidenceStep(c);if(step===5)return `<div class="panel v3-ops-gate"><div class="icon">▤</div><h2>OPS-F0065-S</h2><p class="muted">${c.closedAt?'Cerrado':c.f0065ReviewedAt?'OPS revisado':''}</p><div class="row" style="justify-content:center;flex-wrap:wrap;margin-top:10px"><button id="v3OpenOps" class="btn primary">${c.f0065ReviewedAt?'Volver al OPS':'Revisar OPS-F0065-S'}</button>${c.opsStoragePath?'<button id="v3StoredOps" class="btn">Abrir OPS guardado</button>':''}</div></div>`;return `<div class="panel v3-ops-gate"><div class="icon">✉</div><h2>Daily Move Update</h2><p class="muted">${c.sentAt?'Enviado · '+fmtDate(c.sentAt,true):c.closedAt?'Día cerrado · Listo para revisar y enviar':c.f0065ReviewedAt?'OPS revisado · Cierra el día para habilitar el envío':'Revisa el OPS y cierra el día para habilitar el envío'}</p><div class="row" style="justify-content:center;flex-wrap:wrap;margin-top:10px">${c.closedAt?'<button id="v3OpenEmail" class="btn primary">Revisar Daily Move Update →</button>':'<button id="v3BackOps" class="btn">'+(c.f0065ReviewedAt?'Continuar al cierre del día':'Revisar OPS')+'</button>'}</div></div>`}
function reportScreen(m,p,c){const step=Math.max(0,Math.min(6,+c.reportStep||0));c.reportStep=step;return `<div class="v3-report"><aside class="v3-report-nav">${REPORT_STEPS.map((x,i)=>`<button data-v3-reportstep="${i}" class="${i===step?'active':c.reportVisited?.[i]?'done':''}" ${i>step+1&&!c.reportVisited?.[i]?'disabled':''}><span class="tiny">0${i+1}</span><br>${x}</button>`).join('')}</aside><div class="v3-report-main"><div class="v3-report-head"><div><h2>${REPORT_STEPS[step]}</h2><p>Día ${p.index} · Corte ${p.cutoffTime} · ${fmtDate(p.start,true)} → ${fmtDate(p.end,true)}</p></div><span class="status info">Paso ${step+1} de 7</span></div>${reportBody(m,p,c,step)}<div class="v3-report-footer"><button id="v3ReportPrev" class="btn">${step===0?'← Avance del Día':'← Anterior'}</button><button id="v3ReportNext" class="btn primary" ${step>=5?'style="visibility:hidden"':''}>Siguiente →</button></div></div></div>`}

,user:state.auth.email,action:'ops_generated',period:p.id});save();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}catch(e){alert('No fue posible generar el OPS: '+e.message)}finally{b.disabled=false;b.textContent='Generar PDF'}});$('openStoredOps')?.addEventListener('click',()=>window.RigGOReportV12.openStoredOps(c.opsStoragePath).catch(e=>alert(e.message)));$('sendFromReview')?.addEventListener('click',()=>sendDailyReport(m,p,c));if(state.reportView==='email')setTimeout(()=>drawMailChart(m,p),0);enhanceTimeInputs()};

function advances(m,p){return [...m.exec.tasksRD.filter(x=>(+x.day||1)>p.index&&doneIn(x,p)).map(x=>`Rig Down · Plan D${x.day}: ${x.text}`),...m.exec.loads.filter(x=>(+x.plannedDay||1)>p.index&&(x.history||[]).some(h=>['Cargada','En tránsito','Posicionada'].includes(h.status)&&new Date(h.at)>=new Date(p.start)&&new Date(h.at)<=new Date(p.end))).map(x=>`Carga · Plan D${x.plannedDay}: ${x.description}`),...m.exec.tasksRU.filter(x=>(+x.day||1)>p.index&&doneIn(x,p)).map(x=>`Rig Up · Plan D${x.day}: ${x.text}`)]}
function pendingDay(m,p){return [...m.exec.tasksRD.filter(x=>(+x.day||1)===p.index&&!doneBy(x,p)).map(x=>`Rig Down: ${x.text}`),...m.exec.loads.filter(x=>(+x.plannedDay||1)===p.index&&statusAt(x,p.end)!=='Posicionada').map(x=>`Carga: ${x.description}`),...m.exec.tasksRU.filter(x=>(+x.day||1)===p.index&&!doneBy(x,p)).map(x=>`Rig Up: ${x.text}`)]}

f0065Html=function(m,p,c){let h=BASE_F0065(m,p,c),a=advances(m,p),pd=pendingDay(m,p),g=scopeGrowth(m);h=h.replace('<b>RIG RELEASE</b>','<b>ACTUAL RIG RELEASE</b>');h=h.replace('<td><b>ÁREA:</b> COLOMBIA</td>',`<td><b>ÁREA:</b> COLOMBIA<br><b>OPERADOR:</b> ${enc(m.meta.operator)}</td>`);h=h.replace(`<td><b>DISTANCIA</b> ${m.meta.distanceKm} km</td>`,`<td><b>DISTANCIA</b> ${m.meta.distanceKm} km<br><b>CORTE</b> ${enc(p.cutoffTime)}</td>`);const availability=`<div class="f0065-underline">DISPONIBILIDAD OPERACIONAL 24 H:</div><table class="f0065-table"><tr><th>RECURSO</th><th>DISPONIBILIDAD 24 H</th></tr><tr><td>CAMIONES / TRANSPORTE</td><td>${enc(m.meta.trucks24h||'No')}</td></tr><tr><td>GRÚAS</td><td>${enc(m.meta.cranes24h||'No')}</td></tr></table>`;h=h.replace('<div class="f0065-underline">EQUIPOS LMC:</div>',availability+'<div class="f0065-underline">EQUIPOS LMC:</div>');const milestoneBlock=`<div class="f0065-underline">HITOS:</div><table class="f0065-table"><tr><th>HITO</th><th>BASELINE</th><th>FORECAST</th><th>ACTUAL</th></tr>${(c.milestones||[]).map(x=>`<tr><td>${enc(x.name)}</td><td>${fmtDate(x.base,true)}</td><td>${fmtDate(x.forecast,true)}</td><td>${x.actual?fmtDate(x.actual,true):'—'}</td></tr>`).join('')}</table>`;const block=`<div class="f0065-underline">CONTROL DE CRONOGRAMA / SCOPE:</div><div class="f0065-box" style="font-size:8.5pt"><b>BASELINE / CURRENT SCOPE:</b> RD ${g.bRD} → ${g.cRD} · CARGAS ${g.bL} → ${g.cL} · RU ${g.bRU} → ${g.cRU}<br><br><span class="v3-f0065-advance"><b>ADELANTOS:</b><br>${a.length?a.map(x=>'• '+enc(x)).join('<br>'):'SIN ADELANTOS EN EL PERIODO.'}</span><br><br><span class="v3-f0065-pending"><b>PENDIENTES DEL DÍA:</b><br>${pd.length?pd.map(x=>'• '+enc(x)).join('<br>'):'SIN PENDIENTES DEL PLAN DEL DÍA.'}</span></div>`;h=h.replace('<div class="f0065-underline">ADELANTOS O RETRASOS DEL CRONOGRAMA / FLAT TIME:</div>',milestoneBlock+block+'<div class="f0065-underline">ADELANTOS O RETRASOS DEL CRONOGRAMA / FLAT TIME:</div>');const caps=(c.photoCaptions||[]).map((x,i)=>String(x||'').trim()?`<div><b>FOTO ${i+1}:</b> ${enc(x)}</div>`:'').filter(Boolean);if(caps.length)h=h.replace('<table class="f0065-table"><tr><th class="f0065-blue">PREPARACION PARA EMERGENCIAS</th></tr>',`<div class="f0065-underline">OBSERVACIONES REGISTRO FOTOGRÁFICO:</div><div class="f0065-box" style="font-size:8.5pt">${caps.slice(0,2).join('')}</div><table class="f0065-table"><tr><th class="f0065-blue">PREPARACION PARA EMERGENCIAS</th></tr>`);if((c.photos||[]).length>2){const extra=[];for(let i=2;i<c.photos.length;i+=2)extra.push([i,c.photos.slice(i,i+2)]);const basePages=(h.match(/class="f0065-page"/g)||[]).length,total=basePages+extra.length;h=h.replace(/Page (\d+) of \d+/g,(all,n)=>`Page ${n} of ${total}`);const pages=extra.map(([i,imgs],j)=>`<div class="f0065-page">${fHeader()}<div class="f0065-underline">REGISTRO FOTOGRÁFICO - CONTINUACIÓN:</div><div class="f0065-photo-grid">${imgs.map((src,k)=>`<div>${src?`<img src="${src}">`:''}${c.photoCaptions?.[i+k]?`<div style="font-size:8pt;margin-top:2mm"><b>FOTO ${i+k+1}:</b> ${enc(c.photoCaptions[i+k])}</div>`:''}</div>`).join('')}</div>${fFooter(basePages+j+1,total)}</div>`).join('');h=h.replace(/<\/div><\/div>$/,pages+'</div></div>')}return h};

emailHtml=function(m,p,c,opt={}){let h=BASE_EMAIL(m,p,c,opt),s=suggestedPcts(m,p),a=advances(m,p),pd=pendingDay(m,p);h=h.replace('<span>Rig Release</span>','<span>Actual Rig Release</span>');h=h.replace('<div><span>Periodo</span>',`<div><span>Hora de corte</span><b>${enc(p.cutoffTime)}</b></div><div><span>Periodo</span>`);h=h.replace('<th>Fase</th><th>Plan</th><th>Actual</th><th>Comentario</th>','<th>Fase</th><th>Plan</th><th>Sugerido</th><th>Reportado</th><th>Comentario</th>');h=h.replace(`<tr><td>Rig Down</td><td>${Math.round(currentPlanPcts(m,p).rd)}%</td><td><b>${reportValue(c,'rd',s.rd)}%</b></td>`,`<tr><td>Rig Down</td><td>${Math.round(currentPlanPcts(m,p).rd)}%</td><td>${Math.round(s.rd)}%</td><td><b>${reportValue(c,'rd',s.rd)}%</b></td>`).replace(`<tr><td>Rig Move</td><td>${Math.round(currentPlanPcts(m,p).rm)}%</td><td><b>${reportValue(c,'rm',s.rm)}%</b></td>`,`<tr><td>Rig Move</td><td>${Math.round(currentPlanPcts(m,p).rm)}%</td><td>${Math.round(s.rm)}%</td><td><b>${reportValue(c,'rm',s.rm)}%</b></td>`).replace(`<tr><td>Rig Up</td><td>${Math.round(currentPlanPcts(m,p).ru)}%</td><td><b>${reportValue(c,'ru',s.ru)}%</b></td>`,`<tr><td>Rig Up</td><td>${Math.round(currentPlanPcts(m,p).ru)}%</td><td>${Math.round(s.ru)}%</td><td><b>${reportValue(c,'ru',s.ru)}%</b></td>`);h=h.replace('<h3>Cargas</h3>','<h3>Transporte de Cargas</h3>');const schedule=`<h3>Control de cronograma</h3>${a.length?`<div class="v3-email-advance"><b>Adelantos</b>${a.map(x=>`<div>• ${enc(x)}</div>`).join('')}</div>`:'<div>Sin adelantos.</div>'}${pd.length?`<div class="v3-email-pending" style="margin-top:6px"><b>Pendientes del día</b>${pd.map(x=>`<div>• ${enc(x)}</div>`).join('')}</div>`:'<div style="margin-top:6px">Plan del día sin pendientes.</div>'}`;const ms=`<h3>3. Hitos a Cumplir</h3><table><tr><th>Hito</th><th>Baseline</th><th>Proyección</th><th>Actual</th></tr>${(c.milestones||[]).map(x=>`<tr><td><b>${enc(x.name)}</b></td><td>${fmtDate(x.base,true)}</td><td>${fmtDate(x.forecast,true)}</td><td>${x.actual?fmtDate(x.actual,true):'—'}</td></tr>`).join('')}</table>`;const hs=h.indexOf('<h3>Hitos a Cumplir</h3>'),fs=h.indexOf('<h3>Flat Time / Desviaciones</h3>');if(hs>=0&&fs>hs)h=h.slice(0,hs)+schedule+ms+h.slice(fs);h=h.replace('<h3>3. Actividades planeadas para las próximas 24 Hrs</h3>','<h3>4. Actividades planeadas próximas 24 Hrs</h3>');h=h.replace('<h3>4. Registro fotográfico de avance</h3>','<h3>5. Registro fotográfico</h3>');const caps=(c.photoCaptions||[]).map((x,i)=>String(x||'').trim()?`<div style="font-size:12px;color:#667085"><b>Foto ${i+1}:</b> ${enc(x)}</div>`:'').filter(Boolean);if(caps.length)h=h.replace('<div style="margin-top:18px">Continuaremos reportando',`<div style="margin-top:8px">${caps.slice(0,4).join('')}</div><div style="margin-top:18px">Continuaremos reportando`);return h};

function showGlobalSearch(m,p){sheetRoot.innerHTML=`<div class="sheet-backdrop"><div class="sheet"><div class="sheet-handle"></div><div class="row between"><div><h2>Buscar en la Move</h2><div class="sheet-sub">Actividades y cargas</div></div><button id="v3CloseSearch" class="btn small">Cerrar</button></div><input id="v3GlobalQuery" class="field" placeholder="Ej. VFD, mud pump, lowboy..." style="margin-top:10px"><div id="v3GlobalResults" class="v3-global-results"></div></div></div>`;$('v3CloseSearch').onclick=closeSheet;const input=$('v3GlobalQuery'),box=$('v3GlobalResults');const draw=()=>{const q=input.value.trim().toLowerCase();if(!q){box.innerHTML='<div class="small muted" style="padding:14px 0">Escribe para buscar en toda la Move.</div>';return}const rows=[];(m.exec.tasksRD||[]).forEach(x=>{if(`${x.text} ${x.comment||''}`.toLowerCase().includes(q))rows.push({type:'rd',label:x.text,meta:`Rig Down · Plan Día ${x.day}${x.isUnplanned?' · NO PLANIFICADA':''}`})});(m.exec.loads||[]).forEach(x=>{if(`${x.description} ${x.scope} ${x.vehicle||''}`.toLowerCase().includes(q))rows.push({type:'transport',label:x.description,meta:`Transporte · ${x.scope} · Plan Día ${x.plannedDay}${x.isUnplanned?' · NO PLANIFICADA':''}`})});(m.exec.tasksRU||[]).forEach(x=>{if(`${x.text} ${x.comment||''}`.toLowerCase().includes(q))rows.push({type:'ru',label:x.text,meta:`Rig Up · Plan Día ${x.day}${x.isUnplanned?' · NO PLANIFICADA':''}`})});box.innerHTML=rows.slice(0,40).map(r=>`<button class="v3-global-result" data-v3-searchgo="${r.type}" data-label="${enc(r.label)}"><b>${enc(r.label)}</b><span>${enc(r.meta)}</span></button>`).join('')||'<div class="small muted" style="padding:14px 0">Sin resultados.</div>';box.querySelectorAll('[data-v3-searchgo]').forEach(b=>b.onclick=()=>{state.execTab=b.dataset.v3Searchgo;state.searchMove=b.dataset.label;closeSheet();save();render();scrollTopNow()})};input.oninput=draw;setTimeout(()=>input.focus(),60);draw()}

function v4CSV(line){const out=[];let x='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){x+='"';i++}else q=!q}else if(c===','&&!q){out.push(x.trim());x=''}else x+=c}out.push(x.trim());return out}
function v4WireImport(){const input=$('v4LegacyFile'),result=$('v4ImportResult');input?.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;try{const text=await file.text(),lines=text.split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw new Error('CSV sin filas.');const heads=v4CSV(lines[0]).map(x=>x.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')),idx=n=>heads.indexOf(n),get=(r,...names)=>{for(const n of names){const i=idx(n);if(i>=0&&r[i]!==undefined)return r[i]}return''};let count=0;for(const line of lines.slice(1)){const r=v4CSV(line);if(!get(r,'rig'))continue;const n=newMove(state.auth.email);n.id=uid();n.status='closed';n.management={type:'Real',source:'Legacy'};n.meta.rig=get(r,'rig');n.meta.operator=get(r,'operator','operador');n.meta.origin=get(r,'origin','origen');n.meta.destination=get(r,'destination','destino');n.meta.distanceKm=Number(get(r,'distance','distance_km','distancia'))||0;n.meta.plannedDays=Number(get(r,'planned_days','plan_days','planned'))||0;n.meta.moveCompany=get(r,'move_company','company','empresa_move');n.exec.actualRelease=get(r,'release','actual_release')||'';n.exec.actualAcceptance=get(r,'acceptance','actual_acceptance')||'';n.legacySummary={plan:Number(get(r,'planned_days','plan_days','planned'))||0,gross:Number(get(r,'gross_days','actual_days','gross'))||0,net:Number(get(r,'net_days','net'))||0,actualDays:Number(get(r,'actual_days','gross_days'))||0,flatTimeHours:Number(get(r,'flat_time_hours','flat_hours'))||0,rm:get(r,'rm','rig_manager')||'',importedAt:nowIso()};n.createdBy=state.auth.email;n.audit=[{at:nowIso(),user:state.auth.email,action:'legacy_import',file:file.name}];state.moves.push(n);count++}save();if(result){result.style.color='#8ae4ad';result.textContent=`${count} Moves importadas.`}render()}catch(e){if(result){result.style.color='#ffafb8';result.textContent=String(e.message||e)}}})}

function v4RealHistoryRows(){const out=[];const seen=new Set(),excluded=new Set(state.moves.filter(m=>v4Mgmt(m).deletedAt).map(m=>m.id));for(const m of state.moves){const g=v4Mgmt(m);if(g.deletedAt)continue;if(g.source==='Legacy'&&m.legacySummary){const l=m.legacySummary;out.push({id:m.id,rig:m.meta.rig,operator:m.meta.operator,origin:m.meta.origin,destination:m.meta.destination,distance:Number(m.meta.distanceKm)||0,company:m.meta.moveCompany||'',plan:Number(l.plan)||0,gross:Number(l.gross)||0,net:Number(l.net)||Number(l.gross)||0,actualDays:Number(l.actualDays)||Number(l.gross)||0,flatHours:Number(l.flatTimeHours)||0,acceptance:m.exec.actualAcceptance||'',release:m.exec.actualRelease||'',type:g.type,source:'Legacy',rm:l.rm||'',scopeGrowth:0,move:m});seen.add(m.id);continue}if(m.status==='closed'&&m.exec?.actualRelease&&m.exec?.actualAcceptance){try{const x=closeoutHistoryRow(m);out.push({id:m.id,rig:x.rig,operator:x.operator,origin:m.meta.origin,destination:m.meta.destination,distance:x.distance,company:x.company,plan:Number(x.plan)||0,gross:Number(x.gross)||0,net:Number(x.net)||0,actualDays:v4ClosedDays(m),flatHours:historyNetFlatHours(x),acceptance:m.exec.actualAcceptance,release:m.exec.actualRelease,type:g.type,source:'RigGO',rm:(m.performanceLead||m.access?.assignedEmails?.[0]||''),scopeGrowth:v4ScopeGrowthCount(m),move:m});seen.add(m.id)}catch(_){}}}
 for(const x of state.history||[]){if(seen.has(x.id)||excluded.has(x.id))continue;out.push({id:x.id,rig:x.rig,operator:x.operator||'',origin:x.origin||'',destination:x.destination||'',distance:Number(x.distance)||0,company:x.company||'',plan:Number(x.plan)||0,gross:Number(x.gross)||0,net:Number(x.net)||Number(x.gross)||0,actualDays:Number(x.actualDays)||Number(x.gross)||0,flatHours:historyNetFlatHours(x),acceptance:x.acceptance||'',release:x.release||'',type:'Real',source:'Legacy',rm:'',scopeGrowth:Number(x.scopeGrowth?.g)||0,move:null})}
 return out
}
function v4ScopeGrowthCount(m){if(!m)return 0;const base=(m.plan?.tasksRD?.length||0)+(m.plan?.tasksRU?.length||0)+(m.plan?.loadGroups||[]).reduce((s,x)=>s+(Number(x.quantity)||1),0),cur=(m.exec?.tasksRD?.length||0)+(m.exec?.tasksRU?.length||0)+(m.exec?.loads?.length||0);return Math.max(0,cur-base)}
function v4Score(x){const plan=Number(x.plan)||0;if(plan<=0)return{score:null,gross:0,net:0,scope:100};const adherence=v=>Math.round(Math.min(100,100*plan/Math.max(plan,Number(v)||plan))*10)/10,g=adherence(x.gross),n=adherence(x.net),base=x.move?((x.move.plan?.tasksRD?.length||0)+(x.move.plan?.tasksRU?.length||0)+(x.move.plan?.loadGroups||[]).reduce((s,z)=>s+(Number(z.quantity)||1),0)):0,scope=base?Math.max(0,100-Math.min(100,(Number(x.scopeGrowth)||0)/base*100)):100,score=Math.round((g*.35+n*.55+scope*.10));return{score,gross:g,net:n,scope:Math.round(scope)}}
function v4EventValues(x,field){const set=new Set();if(x.move?.exec?.closures){for(const c of Object.values(x.move.exec.closures)){for(const e of c.flatEvents||[]){if(field==='cause')set.add(FLAT_TYPES.find(t=>t.id===e.type)?.label||e.type||'Otros');else if(e[field])set.add(e[field])}}}return set}
function v4FilteredRows(){const f=state.filters||{};return v4RealHistoryRows().filter(x=>(f.includeTests||x.type!=='Prueba')&&(f.source==='Todos'||!f.source||x.source===f.source)&&(f.rig==='Todos'||!f.rig||x.rig===f.rig)&&(f.operator==='Todos'||!f.operator||x.operator===f.operator)&&(f.company==='Todos'||!f.company||x.company===f.company)&&(!f.distanceMax||x.distance<=+f.distanceMax)&&(!f.dateFrom||!x.acceptance||new Date(x.acceptance)>=new Date(f.dateFrom+'T00:00'))&&(!f.dateTo||!x.acceptance||new Date(x.acceptance)<=new Date(f.dateTo+'T23:59'))&&(f.commercial==='Todos'||!f.commercial||v4EventValues(x,'commercial').has(f.commercial))&&(f.flatCause==='Todos'||!f.flatCause||v4EventValues(x,'cause').has(f.flatCause))&&(f.planFilter==='Todos'||!f.planFilter||(f.planFilter==='On Plan'?x.gross<=x.plan:x.gross>x.plan)))}
function v4Avg(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:0}

function v4Group(rows,key){const g={};for(const x of rows){const k=x[key]||'No definido',a=g[k]||(g[k]={name:k,n:0,plan:0,gross:0,net:0,flat:0,score:[],scope:0});a.n++;a.plan+=x.plan;a.gross+=x.gross;a.net+=x.net;a.flat+=x.flatHours||0;a.scope+=x.scopeGrowth||0;const s=v4Score(x).score;if(s!==null)a.score.push(s)}return Object.values(g).map(a=>({...a,score:Math.round(v4Avg(a.score)),variance:a.gross-a.plan})).sort((a,b)=>b.score-a.score)}
function v4Insights(rows){if(!rows.length)return['Sin datos para el filtro seleccionado.'];const a=v4Aggregates(rows),ins=[`${a.onPlanPct}% de las Moves finalizaron dentro o por debajo del plan.`];const rigs=v4Group(rows,'rig').filter(x=>x.score);if(rigs[0])ins.push(`${rigs[0].name} lidera la adherencia promedio con ${rigs[0].score}/100.`);const companies=v4Group(rows,'company').filter(x=>x.name!=='No definido'&&x.score);if(companies[0])ins.push(`${companies[0].name} presenta la mejor adherencia promedio entre las Move Companies filtradas.`);return ins.slice(0,3)}

function v4CompanyPerformance(rows){const groups=v4Group(rows,'company').filter(x=>x.name!=='No definido').slice(0,9);const issueMap={};for(const x of rows){if(!x.move)continue;for(const c of Object.values(x.move.exec?.closures||{})){for(const e of c.flatEvents||[]){if(e.type!=='move_company')continue;const company=e.company||x.company||'No definido',a=issueMap[company]||(issueMap[company]={n:0,issues:{}});a.n++;const issue=e.issue||e.failureMode||e.subtype||'Otro';a.issues[issue]=(a.issues[issue]||0)+1}}}return `<div class="panel"><div class="row between"><h2>Performance por Move Company</h2><span class="status gray">${groups.length}</span></div><div class="v4-manager-grid" style="margin-top:9px">${groups.map(x=>{const q=issueMap[x.name]||{n:0,issues:{}},top=Object.entries(q.issues).sort((a,b)=>b[1]-a[1])[0];return `<div class="v4-manager-card"><h3>${enc(x.name)}</h3><div class="big">${x.score||'—'}</div><div class="smallrow"><span>Moves</span><b>${x.n}</b></div><div class="smallrow"><span>Variance</span><b>${x.variance>0?'+':''}${round(x.variance,1)} d</b></div><div class="smallrow"><span>Flat Time</span><b>${round(x.flat,1)} h</b></div><div class="smallrow"><span>Incidentes transporte</span><b>${q.n}</b></div>${top?`<div class="smallrow"><span>Top issue</span><b>${enc(top[0])}</b></div>`:''}</div>`}).join('')||'<div class="muted">Sin datos.</div>'}</div></div>`}
